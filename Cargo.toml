[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/settings", "crates/setup"]
default-members = ["crates/core", "crates/app", "crates/settings"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
