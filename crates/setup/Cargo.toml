[package]
name = "tessera-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

# Builds tessera-setup.exe: a per-user installer that carries the release builds of
# tessera.exe and tessera-settings.exe inside it. Build with `scripts\package.ps1`, which
# builds the payload first. Not a default workspace member, so a plain `cargo build`
# never embeds stale binaries.

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
